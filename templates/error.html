<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F7F1E6">
    <link rel="icon" href="{{ pwa_icon_url | default('/app-icon.png') }}" type="image/png">
    <title>{{ title }} · Time Tracker Pro</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #F7F1E6 0%, #F2E6D5 40%, #E9DDCB 100%);
            color: #111827;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .luxury-card {
            background: linear-gradient(135deg, #FEFCF8, #F5EDE1);
            border: 1px solid rgba(148, 126, 86, 0.18);
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.06);
        }
        [data-theme="dark"] body { background: #050403 !important; color: #EDE6D3 !important; }
        [data-theme="dark"] .luxury-card { background: #0C0A07 !important; border-color: rgba(212,175,55,0.12) !important; box-shadow: 0 2px 8px rgba(0,0,0,0.50), 0 12px 40px rgba(0,0,0,0.40) !important; }
        [data-theme="dark"] .text-gray-900 { color: #EDE6D3 !important; }
        [data-theme="dark"] .text-gray-600 { color: #8C7C58 !important; }
        [data-theme="dark"] .text-gray-400 { color: #6E6045 !important; }
        [data-theme="dark"] .bg-gray-900 { background-color: #1A1610 !important; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
</head>
<body class="antialiased">
    <main class="min-h-screen flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-md">
            <div class="luxury-card rounded-3xl p-8">
                <p class="text-xs font-semibold uppercase tracking-[0.22em] text-gray-400">Error {{ status }}</p>
                <h1 class="mt-2 text-2xl font-semibold text-gray-900 tracking-tight">{{ title }}</h1>
                <p class="mt-2 text-sm text-gray-600">{{ message }}</p>
                <div class="mt-6 flex flex-wrap gap-3">
                    <a href="/" class="px-5 py-2.5 rounded-full bg-gray-900 text-amber-300 text-sm font-semibold shadow-md">Go to dashboard</a>
                    <button type="button" onclick="history.back()" class="px-5 py-2.5 rounded-full border border-[rgba(148,126,86,0.35)] text-sm font-semibold text-gray-700 bg-white/80">Go back</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
