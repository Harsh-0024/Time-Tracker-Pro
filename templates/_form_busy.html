<script>
    // Submit buttons show a busy label ("Logging in...") and get disabled. When the
    // browser restores this page from the back/forward cache, that state (plus any
    // hidden copy of the clicked button's name/value) would come back too: buttons
    // stuck disabled, and the next submit carrying the old action. Undo it.
    window.markFormBusy = function (button, busyText) {
        if (!button) return;
        if (!('idleHtml' in button.dataset)) button.dataset.idleHtml = button.innerHTML;
        button.disabled = true;
        if (busyText) button.textContent = busyText;
    };
    window.addEventListener('pageshow', (event) => {
        if (!event.persisted) return;
        document.querySelectorAll('button[data-idle-html]').forEach((button) => {
            button.innerHTML = button.dataset.idleHtml;
            delete button.dataset.idleHtml;
            button.disabled = false;
        });
        document.querySelectorAll('input[data-submitter-copy]').forEach((input) => input.remove());
    });
</script>
